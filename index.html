<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d18">
  <title>ROBOFY AI — Become the Future</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: #f5f7ff;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1b3152 0, #0b1222 42%, #070a12 100%);
    }
    .wrap { width: min(920px, 92%); margin: auto; padding: 42px 0 60px; }
    header { text-align: center; margin-bottom: 30px; }
    .logo { color: #6de5ff; letter-spacing: 5px; font-size: 13px; font-weight: 800; }
    h1 { font-size: clamp(34px, 8vw, 62px); margin: 12px 0; }
    h1 span { color: #6de5ff; }
    .sub { color: #aab7cc; line-height: 1.6; }
    .panel {
      background: rgba(17, 27, 46, .92); border: 1px solid #263c5b;
      border-radius: 22px; padding: 24px; box-shadow: 0 20px 70px #0008;
    }
    .upload {
      min-height: 210px; border: 2px dashed #42617e; border-radius: 16px;
      display: grid; place-items: center; text-align: center; padding: 22px;
      cursor: pointer; background: #0c1728;
    }
    .upload strong { display: block; font-size: 18px; margin: 10px 0; }
    .upload small { color: #9eacc1; }
    input[type=file] { display: none; }
    .preview { display: none; width: 100%; max-height: 360px; object-fit: contain; margin-top: 18px; border-radius: 14px; background: #080d17; }
    button, .download {
      border: 0; border-radius: 12px; padding: 15px 20px; font-size: 16px;
      font-weight: 800; cursor: pointer; text-decoration: none; text-align: center;
    }
    button { width: 100%; margin-top: 18px; color: #07111d; background: linear-gradient(90deg, #6de5ff, #7dffc7); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .status { min-height: 24px; color: #a9c5dc; text-align: center; margin: 16px 0 0; }
    .result { display: none; margin-top: 26px; }
    .result h2 { text-align: center; }
    .result img { width: 100%; max-height: 600px; object-fit: contain; border-radius: 14px; background: #080d17; }
    .download { display: block; margin-top: 14px; color: #07111d; background: #6de5ff; }
    footer { text-align: center; color: #7f8da4; font-size: 12px; margin-top: 24px; line-height: 1.6; }
    @media (max-width: 520px) { .wrap { padding-top: 28px; } .panel { padding: 16px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo">ROBOFY AI</div>
      <h1>Become <span>the Future.</span></h1>
      <p class="sub">Upload a photo and transform yourself into a futuristic humanoid robot.</p>
    </header>

    <section class="panel">
      <label class="upload" for="photo">
        <div>
          <div style="font-size:38px">⬆</div>
          <strong>Choose your photo</strong>
          <small>JPG, PNG or WEBP · Maximum 10 MB</small>
        </div>
      </label>
      <input id="photo" type="file" accept="image/png,image/jpeg,image/webp">
      <img id="preview" class="preview" alt="Your selected photo">
      <button id="transform" disabled>TRANSFORM ME INTO A ROBOT</button>
      <p id="status" class="status" role="status"></p>

      <div id="result" class="result">
        <h2>Your robot version</h2>
        <img id="resultImage" alt="AI robot transformation">
        <a id="download" class="download" download="robofy-robot.png">Download image</a>
      </div>
    </section>
    <footer>ROBOFY AI · Your photo is sent to the AI service to create the transformation.<br>Do not upload photos you do not have permission to use.</footer>
  </main>

  <script>
    const photoInput = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const transformButton = document.getElementById("transform");
    const statusText = document.getElementById("status");
    const resultBox = document.getElementById("result");
    const resultImage = document.getElementById("resultImage");
    const downloadLink = document.getElementById("download");
    let selectedPhoto = null;

    photoInput.addEventListener("change", () => {
      selectedPhoto = photoInput.files[0] || null;
      resultBox.style.display = "none";
      if (!selectedPhoto) {
        preview.style.display = "none";
        transformButton.disabled = true;
        return;
      }
      const allowed = ["image/jpeg", "image/png", "image/webp"];
      if (!allowed.includes(selectedPhoto.type) || selectedPhoto.size > 10 * 1024 * 1024) {
        statusText.textContent = "Choose a JPG, PNG or WEBP image under 10 MB.";
        selectedPhoto = null;
        preview.style.display = "none";
        transformButton.disabled = true;
        return;
      }
      preview.src = URL.createObjectURL(selectedPhoto);
      preview.style.display = "block";
      transformButton.disabled = false;
      statusText.textContent = "Photo ready. Tap the button to begin.";
    });

    transformButton.addEventListener("click", async () => {
      if (!selectedPhoto) return;
      transformButton.disabled = true;
      statusText.textContent = "Working on your transformation. This can take a little while…";
      resultBox.style.display = "none";
      try {
        const formData = new FormData();
        formData.append("photo", selectedPhoto);
        const response = await fetch("/api/transform", { method: "POST", body: formData });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Transformation failed.");
        resultImage.src = data.imageUrl;
        downloadLink.href = data.imageUrl;
        resultBox.style.display = "block";
        statusText.textContent = "Transformation complete!";
      } catch (error) {
        statusText.textContent = error.message || "Something went wrong. Please try again.";
      } finally {
        transformButton.disabled = false;
      }
    });
  </script>
</body>
</html>
